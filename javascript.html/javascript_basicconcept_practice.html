<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- JavaScript must be inside script tag -->
    <script>
        let a = "remsha"
        let b = 5
        let c = a + b
        document.write(c + "<br>")


        // use type of operator to find data type of  string in last question
        document.write(typeof c + "<br>")

        // using conditional statement

        if (b > 0) {
            document.write("b is greater than 0" + "<br>")
        }

        // if else statement
        let d = 10
        if (d > 0) {
            document.write("d is greater than 0" + "<br>")
        }
        else {
            document.write("d is less than 0 " + "<br>")
        }

        // else if stATEMENT

        if (b < 0) {
            document.write("invalid age")
        }
        else if (d < 5) {
            document.write("you r kid ")
        }
        else if (d > 20) {
            document.write("you r young")
        }
        else {
            document.write("you r adult" + "<br>")
        }

        // ternary operator

        let e = 10
        document.write(e > 5 ? "Yes" + "<br>" : "No" + "<br>")

        // practice 
        // use logical operator to find whether the age of person lies between 10 and 20

        let m = 2
        if (m > 10 && m < 20) {
            document.write("you r in range ")
        }
        else {
            document.write("uh r not in range" + "<br>")
        }

        //concept of loop 

        let n = 4
        for (let i = 0; i < 4; i++) {
            document.write(i + "<br>")
        }

        //concept of while

        let v = 9
        let i = 0
        while (i < v) {
            document.write(i + "<br>")
            i++
        }

        //concept of do while

        let z = 10
        let j = 0

        do {
            document.write(j + "<br>")
            j++
        }
        while (j < z)
    </script>


</body>

</html>
