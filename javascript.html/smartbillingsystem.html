<!DOCTYPE html>
<html>
<body>

<h2>Smart Billing</h2>

<input type="text" id="name" placeholder="Name"><br><br>
<input type="number" id="amount" placeholder="Amount"><br><br>
<button onclick="bill()">Calculate</button>

<p id="result"></p>

<script>
function bill(){
    let name = document.getElementById("name").value;
    let amount = document.getElementById("amount").value;

    // validation
    if(name == "" || amount <= 0){
        document.getElementById("result").innerHTML = "Invalid Input";
        return;
    }

    // discount
    let discount = 0;
    if(amount >= 5000) discount = amount * 0.20;
    else if(amount >= 3000) discount = amount * 0.10;
    else if(amount >= 1000) discount = amount * 0.05;

    let afterDiscount = amount - discount;

    // tax
    let tax = afterDiscount * 0.05;

    // final bill
    let final = afterDiscount + tax;

    // status
    let status = final > 4000 ? "Premium Customer" : "Regular Customer";

    // output
    document.getElementById("result").innerHTML =
        "Name: " + name + "<br>" +
        "Original: " + amount + "<br>" +
        "Discount: " + discount + "<br>" +
        "Tax: " + tax + "<br>" +
        "Final Bill: " + final + "<br>" +
        "Status: " + status;
}
</script>

</body>
</html>
