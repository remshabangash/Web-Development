<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav bar</title>
    <style>
        * 
{
    margin: 0;
    padding: 0;
}

body 
{
    height: 100%;
    width: 100%;
}

header 
{
    background-color: teal;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo 
{
    font-size: 22px;
    font-weight: 600;
    text-transform: uppercase;
    color: white;
    text-decoration: none;
}

ul
{
    display: flex;      /* sab items ek line me */
    align-items: center;
    list-style: none;
}

li a 
{
    color: white;
    font-size: 18px;
    margin-right: 25px;
    text-decoration: none;
}

button
{
    margin-left: 10px;
    padding: 6px 12px;
    border: none;
    background: white;
    color: teal;
    border-radius: 5px;
    cursor: pointer;
}
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo">Nav bar</a>
        <ul>
            <li><a href="#" >Home</a></li>
             <li><a href="#">About Us</a></li>
              <li><a href="#">Blog</a></li>
               <li><a href="#">Contact Us</a></li>
               <button type="button">sign in</button>
               <button type="button">sign up</button>
        </ul>
    </header>
</body>
</html>
