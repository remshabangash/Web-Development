<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    background-color:white;
    font-family: Arial, Helvetica, sans-serif;
    justify-content: center;
    align-items: center;
    height: 100vh;
    display: flex;
    margin-top: 0;

}

div {
    padding: 20;
    border:  2px solid;
    
    border-color: rgb(17, 17, 17);
    width: 240;
    height: 470;
    background-color: white;
}

h1 {
    text-align: center;
}

h6
{
    display: block;
    text-align: center;
}


button {
    width: 100%;
    height: 30;
    border-radius: 12px;
    
}

#pass {
    width: 100%;
    height: 30;
    font-weight: bold;

}

#login {
    width: 100%;
    height: 30;
}

#email {
    width: 100%;
    height: 30;

}

#passc {
    width: 100%;
    height: 30;
}
#create {
    display: block;
    text-align: center;
}

    </style>
</head>
<body>
     <div>
        <h1>Register</h1>
        
        <h6>Kindly fill this form to register</h6>
        <label for="login" style="font-weight: bold;">Username</label><br>
        <input type="text" id="login" placeholder="Type your Username">
        <br><br>
        <label for="email" style="font-weight: bold;">Email</label><br>
        <input type="email" id="email" placeholder="Type your Email">
        <br><br>
        <label for="pass" style="font-weight: bold;">Password</label><br>
        <input type="password" id="pass" placeholder="Type your Password">
        <br><br>
        <label for="passc" style="font-weight: bold;"> Confirm Password</label><br>
        <input type="password" id="passc" placeholder="Type your Password Again">
        <br><br>
         
        <button style="background: linear-gradient(120deg, #04AA6D, #058457);">Register</button>
        <br><br>
        <a href="login.html" id="create">Already have account login</a>
        
        
    </div>
</body>
</html>
