<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="box.css">
</head>
<body>

    <!-- Normal box (content only) -->
    <div class="box">Box 1</div>
    <br><br>

    <!-- Box with padding -->
    <div class="box padding">Box 2</div>
    <br><br>

    <!-- Box with border -->
    <div class="box border">Box 3</div>
    <br><br>

    <!-- Boxes with margin concept -->
    <div class="container">
        <div class="box">Box 4</div>
        <div class="box">Box 5</div>
        <div class="box">Box 6</div>
    </div>
<!-- box model demonstration -->

</body>
</html>
